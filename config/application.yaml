# Tiering-KV 生产配置（ADR-0034）
server:
  host: 0.0.0.0
  port: 6379
  max-clients: 10000
  timeout-seconds: 0
  # password: "" # 留空则默认 default 用户免密；亦可通过环境变量 TIERING_PASSWORD 设置
  tls:
    enabled: false
    # cert-path: /etc/tiering-kv/tls/server.crt
    # key-path: /etc/tiering-kv/tls/server.key
    # ca-path: /etc/tiering-kv/tls/ca.crt
    # require-client-auth: false

worker:
  shard-count: 16
  flush-workers: 1
  migration-workers: 2

memory:
  limit: 1073741824

wal:
  fsync-policy: EVERY_SEC
  max-segment-bytes: 67108864

cache:
  block-size: 1024
  hotkey-window-ms: 1000
  hotkey-threshold: 1000

tiering:
  low-watermark: 0.70
  high-watermark: 0.85
  critical-watermark: 0.95
  backpressure-timeout-ms: 1000
  drain-timeout-ms: 5000

gc:
  batch-size: 4096
  worker-count: 4
  max-memory: 67108864

txn:
  ttl-seconds: 60
  max-duration-seconds: 300
