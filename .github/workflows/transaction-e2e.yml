name: transaction-e2e

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  jvm-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: JVM container-equivalent E2E
        # 慢 runner 上 Raft 选举窗口内并发写入偶发 "no metadata leader"；
        # 失败用例重跑一次，重跑仍失败则门禁照常失败。
        run: mvn -q -Dsurefire.rerunFailingTestsCount=1 -Dtest=CiTransactionE2ETest,CiTransactionE2EParameterizedTest,RealDiskChaosTest,RealDiskChaosParameterizedTest,MetadataNetworkRaftTest,MetadataNetworkRaftExtendedTest -DfailIfNoTests=false test

  container-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Build image
        # GitHub runner 的 BuildKit 偶发 gRPC EOF（瞬时基础设施故障）；
        # 构建幂等，重试 3 次吸收抖动，避免整条 e2e 因一次连接中断失败。
        run: |
          for i in 1 2 3; do
            if docker compose -f deploy/docker-compose.transaction.yml build; then
              exit 0
            fi
            echo "docker build attempt ${i}/3 failed, retrying in 10s..." >&2
            sleep 10
          done
          exit 1
      - name: Start cluster
        run: docker compose -f deploy/docker-compose.transaction.yml up -d --wait
      - name: Health check gateway
        run: |
          for i in $(seq 1 30); do
            if (echo > /dev/tcp/127.0.0.1/6379) 2>/dev/null; then
              echo "gateway ready"
              exit 0
            fi
            sleep 2
          done
          echo "gateway not ready" >&2
          docker compose -f deploy/docker-compose.transaction.yml ps
          exit 1
      - name: Container smoke SET/GET
        run: |
          # redis-cli 不可用时的最小 RESP 冒烟（读取并断言响应，
          # 禁止“只写不读”的伪冒烟）
          timeout 10 bash -c '
            exec 3<>/dev/tcp/127.0.0.1/6379
            printf "*3\r\n\$3\r\nSET\r\n\$2\r\nk1\r\n\$2\r\nv1\r\n" >&3
            IFS= read -r line <&3 || exit 1
            [ "$line" = "+OK" ] || { echo "SET smoke failed: $line" >&2; exit 1; }
            printf "*2\r\n\$3\r\nGET\r\n\$2\r\nk1\r\n" >&3
            IFS= read -r line <&3 || exit 1
            [ "$line" = "\$2" ] || { echo "GET header failed: $line" >&2; exit 1; }
            IFS= read -r line <&3 || exit 1
            [ "$line" = "v1" ] || { echo "GET body failed: $line" >&2; exit 1; }
            exec 3<&- 3>&-
          '
      - name: Network chaos delay
        run: |
          scripts/network-chaos.sh delay 100ms
          TIERINGKV_NETWORK_CHAOS=true TIERINGKV_NETEM_EXPECT=delay \
            mvn -q -Dtest=RealNetworkChaosTest#setGetRoundTripUnderNetem \
            -DfailIfNoTests=false test
      - name: Network chaos loss
        run: |
          scripts/network-chaos.sh loss 10%
          TIERINGKV_NETWORK_CHAOS=true TIERINGKV_NETEM_EXPECT=loss \
            mvn -q -Dtest=RealNetworkChaosTest#setGetRoundTripUnderNetem \
            -DfailIfNoTests=false test
      - name: Network chaos partition
        run: |
          scripts/network-chaos.sh partition
          TIERINGKV_NETWORK_CHAOS=true TIERINGKV_NETEM_EXPECT=partition \
            mvn -q -Dtest=RealNetworkChaosTest#partitionBlocksRoundTrip \
            -DfailIfNoTests=false test
      - name: Network chaos recover
        run: |
          scripts/network-chaos.sh recover
          TIERINGKV_NETWORK_CHAOS=true TIERINGKV_NETEM_EXPECT=recovered \
            mvn -q -Dtest=RealNetworkChaosTest#setGetRoundTripUnderNetem \
            -DfailIfNoTests=false test
      - name: Container fault injection
        run: |
          scripts/container-chaos.sh kill-coordinator
          scripts/container-chaos.sh kill-participant
          scripts/container-chaos.sh kill-meta
          scripts/container-chaos.sh partition
      - name: Smoke after fault injection
        run: |
          printf '*3\r\n$3\r\nSET\r\n$2\r\nk2\r\n$2\r\nv2\r\n' \
            | timeout 5 bash -c 'cat > /dev/tcp/127.0.0.1/6379'
          printf '*2\r\n$3\r\nGET\r\n$2\r\nk2\r\n' \
            | timeout 5 bash -c 'cat > /dev/tcp/127.0.0.1/6379'
      - name: Collect logs
        if: always()
        run: docker compose -f deploy/docker-compose.transaction.yml logs --tail=200
      - name: Cleanup
        if: always()
        run: docker compose -f deploy/docker-compose.transaction.yml down -v

  kind-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - uses: helm/kind-action@v1
        with:
          cluster_name: tiering-kv
      - name: Build and load image
        run: |
          mvn -q -DskipTests package
          for i in 1 2 3; do
            if docker build -t ghcr.io/holylaw7/tiering-kv:v3.7.0 -f deploy/Dockerfile .; then
              kind load docker-image ghcr.io/holylaw7/tiering-kv:v3.7.0 --name tiering-kv
              exit 0
            fi
            echo "docker build attempt ${i}/3 failed, retrying in 10s..." >&2
            sleep 10
          done
          exit 1
      - name: Kind in-cluster validation
        run: |
          TIERINGKV_KIND_CLUSTER=true scripts/kind-e2e.sh run
          TIERINGKV_KIND_CLUSTER=true scripts/kind-e2e.sh pdb-drain
          TIERINGKV_KIND_CLUSTER=true mvn -q -Dtest=KubernetesInClusterValidationTest -DfailIfNoTests=false test
      - name: Collect cluster logs
        if: always()
        run: kubectl -n tiering-kv get pods,svc,pdb
      - name: Cleanup
        if: always()
        run: TIERINGKV_KIND_CLUSTER=true scripts/kind-e2e.sh cleanup

  block-device-chaos:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Block device setup
        run: |
          sudo scripts/block-device-chaos.sh setup
      - name: Gated block device smoke + exercise (baseline, disk-full)
        run: |
          TIERINGKV_CONTAINER_CHAOS=true TIERINGKV_BLOCK_DEVICE_READY=true \
            mvn -q -Dtest=RealBlockDeviceChaosTest,RealBlockDeviceExerciseTest \
            -DfailIfNoTests=false test
      - name: Readonly block device exercise
        run: |
          sudo scripts/block-device-chaos.sh readonly
          TIERINGKV_CONTAINER_CHAOS=true TIERINGKV_BLOCK_READONLY=true \
            mvn -q -Dtest=RealBlockDeviceExerciseTest#readonlyAppendFailsWithoutLoss \
            -DfailIfNoTests=false test
          sudo mount -o remount,rw /mnt/tiering-kv-block
      - name: Cleanup
        if: always()
        run: sudo scripts/block-device-chaos.sh cleanup

  jepsen-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Jepsen externalized validation
        run: scripts/jepsen-run.sh run
      - name: Collect report
        if: always()
        run: cat target/jepsen-report.txt
      - name: Cleanup
        if: always()
        run: scripts/jepsen-run.sh cleanup
