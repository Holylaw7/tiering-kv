name: transaction-e2e

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  jvm-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: JVM container-equivalent E2E
        run: mvn -q -Dtest=CiTransactionE2ETest,RealDiskChaosTest -DfailIfNoTests=false test

  container-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker compose -f deploy/docker-compose.transaction.yml build
      - name: Start cluster
        run: docker compose -f deploy/docker-compose.transaction.yml up -d --wait
      - name: Health check gateway
        run: |
          for i in $(seq 1 30); do
            if (echo > /dev/tcp/127.0.0.1/6379) 2>/dev/null; then
              echo "gateway ready"
              exit 0
            fi
            sleep 2
          done
          echo "gateway not ready" >&2
          docker compose -f deploy/docker-compose.transaction.yml ps
          exit 1
      - name: Container smoke SET/GET
        run: |
          # redis-cli 不可用时的最小 RESP 冒烟
          printf '*3\r\n$3\r\nSET\r\n$2\r\nk1\r\n$2\r\nv1\r\n' \
            | timeout 5 bash -c 'cat > /dev/tcp/127.0.0.1/6379'
          sleep 1
          printf '*2\r\n$3\r\nGET\r\n$2\r\nk1\r\n' \
            | timeout 5 bash -c 'cat > /dev/tcp/127.0.0.1/6379'
      - name: Collect logs
        if: always()
        run: docker compose -f deploy/docker-compose.transaction.yml logs --tail=200
      - name: Cleanup
        if: always()
        run: docker compose -f deploy/docker-compose.transaction.yml down -v
