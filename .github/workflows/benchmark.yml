name: benchmark

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * 0"   # 每周日 02:00（示例，Phase 9 定稿）

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: bash scripts/benchmark.sh
      # TODO(phase9): 上传报告 artifact 并执行性能回归门禁
