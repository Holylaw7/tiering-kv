name: release

on:
  push:
    # ADR-0360：任意 v* 标签自动发版（此前为逐版本硬编码列表，
    # 导致 v5.x 每次都只能手动发版）。checkpoint-*/phase-* 不匹配。
    #
    # "v*" 是功能性触发条件（ADR-0360）；其后的历史标签字面量仅用于
    # 冻结门禁（ReleaseV11…V37GATest 会解析 YAML 并断言列表包含各自版本），
    # 保留它们让历史发布记录在流水线里仍可追溯。
    tags: ["v*",
           "v1.0.0-rc*", "v1.0.0", "v1.1.0-rc*", "v1.1.0",
           "v1.2.0-rc*", "v1.2.0", "v1.3.0-rc*", "v1.3.0",
           "v1.4.0-rc*", "v1.4.0", "v1.5.0-rc*", "v1.5.0",
           "v1.6.0-rc*", "v1.6.0", "v1.7.0-rc*", "v1.7.0",
           "v1.8.0-rc*", "v1.8.0", "v1.9.0-rc*", "v1.9.0",
           "v2.0.0-rc*", "v2.0.0", "v2.1.0-rc*", "v2.1.0",
           "v2.2.0-rc*", "v2.2.0", "v2.3.0-rc*", "v2.3.0",
           "v2.4.0-rc*", "v2.4.0", "v2.5.0-rc*", "v2.5.0",
           "v2.6.0-rc*", "v2.6.0", "v2.7.0-rc*", "v2.7.0",
           "v2.8.0-rc*", "v2.8.0",
           "v2.9.0-rc*", "v2.9.0",
           "v3.0.0-rc*", "v3.0.0",
           "v3.1.0-rc*", "v3.1.0",
           "v3.2.0-rc*", "v3.2.0",
           "v3.3.0-rc*", "v3.3.0",
           "v3.4.0-rc*", "v3.4.0",
           "v3.5.0-rc*", "v3.5.0",
           "v3.6.0-rc*", "v3.6.0",
           "v3.7.0-rc*", "v3.7.0",
           "v3.7.1-rc*", "v3.7.1",
           "v4.0.0-rc*", "v4.0.0",
           "v4.1.0-rc*", "v4.1.0"]
  workflow_dispatch:

jobs:
  test-shards:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Compile tests
        run: mvn -B -q test-compile
      - name: Build shard test list
        run: |
          scripts/shard-tests.sh ${{ matrix.shard }} 3 > /tmp/shard-tests.txt
          echo "shard ${{ matrix.shard }}: $(tr ',' '\n' < /tmp/shard-tests.txt | wc -l) classes"
      - name: Run shard tests
        run: |
          mvn -B -Dsurefire.rerunFailingTestsCount=1 \
            -Dsurefire.excludedGroups=benchmark \
            -Dtest="$(cat /tmp/shard-tests.txt)" test
      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-shard-${{ matrix.shard }}
          path: target/surefire-reports
          if-no-files-found: ignore
          retention-days: 7

  # 控制面 + 前端门禁：发布前必须证明"前后端都能构建、控制面测试全绿"
  console:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Console server tests
        working-directory: console-server
        run: mvn -B -q test
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: console-web/package-lock.json
      - name: Frontend typecheck and build
        working-directory: console-web
        run: |
          npm ci
          npm run build

  release:
    runs-on: ubuntu-latest
    needs: [test-shards, console]
    timeout-minutes: 60
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Benchmark
        # 显式覆盖 excludedGroups 为空并列出全部 @Tag("benchmark") 类（71 个），
        # 确保 benchmark 仍在发布门禁执行。
        run: mvn -q -Dtest='Phase24BenchmarkTest,Phase25BenchmarkTest,Phase26BenchmarkTest,Phase27BenchmarkTest,Phase28BenchmarkTest,Phase29BenchmarkTest,Phase30BenchmarkTest,Phase31BenchmarkTest,Phase32BenchmarkTest,Phase33BenchmarkTest,Phase34BenchmarkTest,Phase35BenchmarkTest,Phase36BenchmarkTest,Phase37BenchmarkTest,Phase38BenchmarkTest,Phase39BenchmarkTest,Phase40BenchmarkTest,Phase41BenchmarkTest,Phase42BenchmarkTest,Phase43BenchmarkTest,Phase43ProductionBaselineTest,Phase44BenchmarkTest,Phase44ProductionBaselineTest,Phase45BenchmarkTest,Phase45ProductionBaselineTest,Phase46BenchmarkTest,Phase46ProductionBaselineTest,Phase47BenchmarkTest,Phase47ProductionBaselineTest,Phase48BenchmarkTest,Phase48ProductionBaselineTest,Phase49BenchmarkTest,Phase49ProductionBaselineTest,Phase50BenchmarkTest,Phase50ProductionBaselineTest,Phase51BenchmarkTest,Phase51ProductionBaselineTest,Phase52BenchmarkTest,Phase52ProductionBaselineTest,Phase53BenchmarkTest,Phase53ProductionBaselineTest,Phase54BenchmarkTest,Phase54ProductionBaselineTest,Phase55BenchmarkTest,Phase55ProductionBaselineTest,Phase56BenchmarkTest,Phase56ProductionBaselineTest,CacheEvictionBenchmarkTest,ClusterBenchmarkTest,ColdBenchmarkTest,ConcurrencyBenchmarkTest,DistributedOptimizationBenchmarkTest,DistributedProductionBenchmarkTest,GatewayBenchmarkTest,HnswSearchBenchmarkTest,IOBenchmarkTest,LatencySmokeTest,MemoryEngineBenchmarkTest,MultiRaftBenchmarkTest,ParallelMigrationBenchmarkTest,Phase15ProductionValidationBenchmarkTest,Phase17RegionBenchmarkTest,Phase19MvccBenchmarkTest,Phase20MvccBenchmarkTest,Phase21BenchmarkTest,Phase22BenchmarkTest,Phase23BenchmarkTest,ProductionBenchmarkTest,ProductionHardeningBenchmarkTest,TieringBenchmarkTest,WALBenchmarkTest,ZeroCopyMigrationBenchmarkTest' -Dsurefire.excludedGroups= -DfailIfNoTests=false test
      - name: Security scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          exit-code: "1"
          ignore-unfixed: true
      - name: Build image
        run: docker build -t ghcr.io/holylaw7/tiering-kv:${GITHUB_REF_NAME} -f deploy/Dockerfile .
      - name: Publish image
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker push ghcr.io/holylaw7/tiering-kv:${GITHUB_REF_NAME}
      - name: Checksums
        run: |
          find target -name '*.jar' -exec sha256sum {} + > target/checksums.sha256
          cat target/checksums.sha256
      - name: Generate release notes
        run: |
          chmod +x scripts/release-notes.sh
          ./scripts/release-notes.sh "${GITHUB_REF_NAME}" > release-notes.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          body_path: release-notes.md
