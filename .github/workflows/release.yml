name: release

on:
  push:
    tags: ["v1.0.0-rc*", "v1.0.0", "v1.1.0-rc*", "v1.1.0",
           "v1.2.0-rc*", "v1.2.0", "v1.3.0-rc*", "v1.3.0",
           "v1.4.0-rc*", "v1.4.0", "v1.5.0-rc*", "v1.5.0",
           "v1.6.0-rc*", "v1.6.0", "v1.7.0-rc*", "v1.7.0",
           "v1.8.0-rc*", "v1.8.0", "v1.9.0-rc*", "v1.9.0",
           "v2.0.0-rc*", "v2.0.0", "v2.1.0-rc*", "v2.1.0",
           "v2.2.0-rc*", "v2.2.0", "v2.3.0-rc*", "v2.3.0",
           "v2.4.0-rc*", "v2.4.0", "v2.5.0-rc*", "v2.5.0",
           "v2.6.0-rc*", "v2.6.0", "v2.7.0-rc*", "v2.7.0",
            "v2.8.0-rc*", "v2.8.0",
            "v2.9.0-rc*", "v2.9.0",
            "v3.0.0-rc*", "v3.0.0",
            "v3.1.0-rc*", "v3.1.0",
            "v3.2.0-rc*", "v3.2.0",
            "v3.3.0-rc*", "v3.3.0",
            "v3.4.0-rc*", "v3.4.0",
            "v3.5.0-rc*", "v3.5.0",
            "v3.6.0-rc*", "v3.6.0"]
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Test
        run: mvn -q test
      - name: Benchmark
        run: mvn -q -Dtest='Phase24BenchmarkTest,Phase25BenchmarkTest,Phase26BenchmarkTest,Phase27BenchmarkTest,Phase28BenchmarkTest,Phase29BenchmarkTest,Phase30BenchmarkTest,Phase31BenchmarkTest,Phase32BenchmarkTest,Phase33BenchmarkTest,Phase34BenchmarkTest,Phase35BenchmarkTest,Phase36BenchmarkTest,Phase37BenchmarkTest,Phase38BenchmarkTest,Phase39BenchmarkTest,Phase40BenchmarkTest,Phase41BenchmarkTest,Phase42BenchmarkTest,Phase43BenchmarkTest,Phase43ProductionBaselineTest,Phase44BenchmarkTest,Phase44ProductionBaselineTest,Phase45BenchmarkTest,Phase45ProductionBaselineTest,Phase46BenchmarkTest,Phase46ProductionBaselineTest,Phase47BenchmarkTest,Phase47ProductionBaselineTest,Phase48BenchmarkTest,Phase48ProductionBaselineTest,Phase49BenchmarkTest,Phase49ProductionBaselineTest,Phase50BenchmarkTest,Phase50ProductionBaselineTest,Phase51BenchmarkTest,Phase51ProductionBaselineTest,Phase52BenchmarkTest,Phase52ProductionBaselineTest,Phase53BenchmarkTest,Phase53ProductionBaselineTest,Phase54BenchmarkTest,Phase54ProductionBaselineTest' -DfailIfNoTests=false test
      - name: Security scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          exit-code: "1"
          ignore-unfixed: true
      - name: Build image
        run: docker build -t ghcr.io/tiering-kv/tiering-kv:${GITHUB_REF_NAME} -f deploy/Dockerfile .
      - name: Publish image
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker push ghcr.io/tiering-kv/tiering-kv:${GITHUB_REF_NAME}
      - name: Checksums
        run: |
          find target -name '*.jar' -exec sha256sum {} + > target/checksums.sha256
          cat target/checksums.sha256
      - name: Generate release notes
        run: |
          chmod +x scripts/release-notes.sh
          ./scripts/release-notes.sh "${GITHUB_REF_NAME}" > release-notes.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          body_path: release-notes.md
