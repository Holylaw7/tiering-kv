name: release

on:
  push:
    tags: ["v1.0.0-rc*", "v1.0.0", "v1.1.0-rc*", "v1.1.0",
           "v1.2.0-rc*", "v1.2.0", "v1.3.0-rc*", "v1.3.0",
           "v1.4.0-rc*", "v1.4.0", "v1.5.0-rc*", "v1.5.0"]
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Test
        run: mvn -q test
      - name: Benchmark
        run: mvn -q -Dtest='Phase24BenchmarkTest,Phase25BenchmarkTest,Phase26BenchmarkTest,Phase27BenchmarkTest,Phase28BenchmarkTest,Phase29BenchmarkTest,Phase30BenchmarkTest,Phase31BenchmarkTest,Phase32BenchmarkTest' -DfailIfNoTests=false test
      - name: Security scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          exit-code: "1"
          ignore-unfixed: true
      - name: Build image
        run: docker build -t ghcr.io/tiering-kv/tiering-kv:${GITHUB_REF_NAME} -f deploy/Dockerfile .
      - name: Publish image
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker push ghcr.io/tiering-kv/tiering-kv:${GITHUB_REF_NAME}
      - name: Generate release notes
        run: |
          chmod +x scripts/release-notes.sh
          ./scripts/release-notes.sh "${GITHUB_REF_NAME}" > release-notes.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          body_path: release-notes.md
