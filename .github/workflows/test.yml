name: test

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MAVEN_ARGS: >-
    -ntp
    -Daether.transport.http.retryHandler.count=5
    -Daether.transport.http.retryHandler.interval=3000
    -Daether.transport.http.retryHandler.serviceUnavailable=429,500,502,503,504
    -Daether.connector.http.retryHandler.count=5
    -Daether.connector.http.retryHandler.interval=3000
    -Daether.connector.http.retryHandler.serviceUnavailable=429,500,502,503,504

jobs:
  unit-and-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Configure CI Maven mirror
        run: mkdir -p ~/.m2 && cp .github/maven-ci-settings.xml ~/.m2/settings.xml
      # 性能断言（@Tag("benchmark")）从功能门禁排除，由 release Benchmark 步骤
      # 显式执行；失败用例重跑一次，重跑仍失败则门禁照常失败，不掩盖真实缺陷。
      - name: Compile tests
        run: mvn -B -q process-test-classes
      - name: Build shard test list
        run: |
          scripts/shard-tests.sh ${{ matrix.shard }} 3 > /tmp/shard-tests.txt
          echo "shard ${{ matrix.shard }}: $(tr ',' '\n' < /tmp/shard-tests.txt | wc -l) classes"
      - name: Run shard tests
        run: |
          mvn -B -Dsurefire.rerunFailingTestsCount=1 \
            -Dsurefire.excludedGroups=benchmark \
            -Dtest="$(cat /tmp/shard-tests.txt)" test
      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: surefire-reports
          path: "*/target/surefire-reports"
          if-no-files-found: ignore
          retention-days: 7
  jfr-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Configure CI Maven mirror
        run: mkdir -p ~/.m2 && cp .github/maven-ci-settings.xml ~/.m2/settings.xml
      - name: JFR recording smoke
        run: |
          mvn -B -Djacoco.skip=true \
            -Dtieringkv.argline="-XX:StartFlightRecording=filename=jfr-smoke.jfr,settings=profile,maxsize=64m,dumponexit=true" \
            -Dtest=PackageBoundaryTest,TracerTest,GatewayRuntimeRespTest test
      - name: Upload JFR
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: jfr-smoke
          path: "*.jfr"
          if-no-files-found: ignore
          retention-days: 7

  console-and-web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Configure CI Maven mirror
        run: mkdir -p ~/.m2 && cp .github/maven-ci-settings.xml ~/.m2/settings.xml
      - name: Console server tests & JaCoCo coverage gate
        working-directory: console-server
        run: mvn -B -q test org.jacoco:jacoco-maven-plugin:check
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: console-web/package-lock.json
      - name: Frontend lint, typecheck, build, Vitest and security audit
        working-directory: console-web
        run: |
          npm ci
          npm run lint
          npm run build
          npm test
          npm audit --audit-level=high
      - name: OpenAPI contract drift check
        working-directory: console-web
        run: |
          npm run gen:api
          git diff --exit-code -- src/api/schema.d.ts ../docs/api/openapi.json

  docker-compose-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Validate compose manifests
        run: |
          docker compose -f deploy/docker-compose.yml config --quiet
          docker compose -f deploy/console/docker-compose.yml config --quiet
          docker compose -f deploy/console/docker-compose.yml --profile minio config --quiet
          docker compose -f deploy/console/docker-compose.yml -f deploy/console/docker-compose.ha.yml --profile s3 config --quiet
          MYSQL_ROOT_PASSWORD=ci-test-root-pass \
          CONSOLE_JWT_SECRET=ci-test-jwt-secret-must-be-32-chars-min \
          CONSOLE_ADMIN_PASSWORD=ci-admin-pass-123 \
          docker compose -f deploy/console/docker-compose.yml -f deploy/console/docker-compose.prod.yml config --quiet

  spotbugs-high:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Configure CI Maven mirror
        run: mkdir -p ~/.m2 && cp .github/maven-ci-settings.xml ~/.m2/settings.xml
      - name: SpotBugs High severity gate
        run: |
          mvn -B -pl tiering-protocol,tiering-storage,tiering-server,tiering-cluster,tiering-operator \
            -DskipTests test-compile jar:test-jar com.github.spotbugs:spotbugs-maven-plugin:check \
            -Dspotbugs.threshold=High -Dspotbugs.failOnError=true
      - name: Console server SpotBugs High gate
        working-directory: console-server
        run: |
          mvn -B -DskipTests test-compile com.github.spotbugs:spotbugs-maven-plugin:check \
            -Dspotbugs.threshold=High -Dspotbugs.failOnError=true

  security-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Configure CI Maven mirror
        run: mkdir -p ~/.m2 && cp .github/maven-ci-settings.xml ~/.m2/settings.xml
      - name: Build artifacts for dependency & JAR scan
        run: mvn -B -q -DskipTests package
      - name: Assert zero Trivy exceptions
        run: |
          if grep -qE '^[^#[:space:]]' .trivyignore; then
            echo "Unexpected active CVE entries in .trivyignore:" >&2
            grep -E '^[^#[:space:]]' .trivyignore >&2
            exit 1
          fi
          echo ".trivyignore has 0 active CVE exceptions"
      - name: Trivy zero-exception security scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          exit-code: "1"
          ignore-unfixed: true
          trivyignores: .trivyignore
          severity: "CRITICAL,HIGH"

  docker-compose-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: console-web/package-lock.json
      - name: Install Playwright Chromium
        working-directory: console-web
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Start full-stack compose
        working-directory: deploy/console
        run: docker compose up -d --build
      - name: Wait for console stack readiness
        run: |
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:8081/ >/dev/null && \
               curl -fsS -X POST http://127.0.0.1:8081/api/v1/auth/login \
                 -H "Content-Type: application/json" \
                 -d '{"username":"admin","password":"admin123"}' >/dev/null; then
              echo "Stack ready"
              exit 0
            fi
            sleep 2
          done
          echo "Timed out waiting for stack readiness"
          exit 1
      - name: Run Playwright E2E
        working-directory: console-web
        env:
          E2E_BASE_URL: http://127.0.0.1:8081
        run: npm run test:e2e
      - name: Dump compose logs on failure
        if: failure()
        working-directory: deploy/console
        run: docker compose logs --tail=200
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: |
            console-web/playwright-report
            console-web/test-results
          if-no-files-found: ignore
          retention-days: 7
      - name: Tear down compose stack
        if: always()
        working-directory: deploy/console
        run: docker compose down -v

  docker-compose-s3-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: console-web/package-lock.json
      - name: Install Playwright Chromium
        working-directory: console-web
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Start full-stack compose with S3/RustFS profile
        working-directory: deploy/console
        env:
          CONSOLE_BACKUP_STORAGE: s3
        run: docker compose --profile s3 up -d --build
      - name: Wait for S3 and console stack readiness
        run: |
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:9000/health/ready >/dev/null && \
               curl -fsS http://127.0.0.1:8081/ >/dev/null && \
               curl -fsS -X POST http://127.0.0.1:8081/api/v1/auth/login \
                 -H "Content-Type: application/json" \
                 -d '{"username":"admin","password":"admin123"}' >/dev/null; then
              echo "S3 + Console stack ready"
              exit 0
            fi
            sleep 2
          done
          echo "Timed out waiting for S3 + Console stack readiness"
          exit 1
      - name: Run S3 Playwright E2E
        working-directory: console-web
        env:
          E2E_BASE_URL: http://127.0.0.1:8081
          E2E_S3_MODE: "true"
        run: npx playwright test e2e/backups-s3-storage.spec.ts
      - name: Dump compose logs on failure
        if: failure()
        working-directory: deploy/console
        run: docker compose --profile s3 logs --tail=200
      - name: Upload S3 Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-s3-report
          path: |
            console-web/playwright-report
            console-web/test-results
          if-no-files-found: ignore
          retention-days: 7
      - name: Tear down S3 compose stack
        if: always()
        working-directory: deploy/console
        run: docker compose --profile s3 down -v

  docker-compose-ha-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Start 2-replica HA console stack
        working-directory: deploy/console
        env:
          CONSOLE_BACKUP_STORAGE: s3
        run: docker compose -f docker-compose.yml -f docker-compose.ha.yml --profile s3 up -d --build
      - name: Wait for both replicas and Nginx HA readiness
        run: |
          for i in $(seq 1 60); do
            s1=$(docker inspect -f '{{.State.Health.Status}}' tk-console 2>/dev/null || echo "starting")
            s2=$(docker inspect -f '{{.State.Health.Status}}' tk-console-2 2>/dev/null || echo "starting")
            if [ "$s1" = "healthy" ] && [ "$s2" = "healthy" ] && \
               curl -fsS http://127.0.0.1:8081/healthz >/dev/null && \
               curl -fsS -X POST http://127.0.0.1:8081/api/v1/auth/login \
                 -H "Content-Type: application/json" \
                 -d '{"username":"admin","password":"admin123"}' >/dev/null; then
              echo "HA stack ready (tk-console=$s1, tk-console-2=$s2)"
              exit 0
            fi
            sleep 2
          done
          echo "Timed out waiting for HA stack readiness"
          exit 1
      - name: Verify cross-replica DB login rate limit, single-leader sampling & failover
        run: |
          set -euo pipefail
          MYSQL_CMD="docker exec -e MYSQL_PWD=tk_root_pwd tk-mysql mysql -uroot -N -B tiering_console -e"

          # 1. Obtain valid JWT before probing rate limit
          TOKEN=$(curl -fsS -X POST http://127.0.0.1:8081/api/v1/auth/login \
            -H "Content-Type: application/json" \
            -d '{"username":"admin","password":"admin123"}' \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["data"]["token"])')
          test -n "$TOKEN"

          # 2. Cross-replica shared DB login rate limiting (round-robin across tk-console & tk-console-2)
          for attempt in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8081/api/v1/auth/login \
              -H "Content-Type: application/json" \
              -d '{"username":"ha_lock_probe","password":"wrong-password"}')
            echo "Login probe #$attempt -> HTTP $code"
            test "$code" = "401"
          done
          locked_code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8081/api/v1/auth/login \
            -H "Content-Type: application/json" \
            -d '{"username":"ha_lock_probe","password":"wrong-password"}')
          echo "Login probe #6 (cross-replica lockout) -> HTTP $locked_code"
          test "$locked_code" = "429"
          fail_count=$($MYSQL_CMD "SELECT fail_count FROM login_attempt WHERE bucket_key='u:ha_lock_probe';")
          echo "DB login_attempt fail_count=$fail_count"
          test "${fail_count:-0}" -ge 5

          # 2.5. Cross-replica JWT revocation (v6.1.0 A2/A3): logout on one replica invalidates across all replicas
          PROBE_USER="ha_revoke_probe"
          PROBE_UID=$(curl -fsS -X POST http://127.0.0.1:8081/api/v1/users \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"username\":\"${PROBE_USER}\",\"password\":\"probePass123\",\"role\":\"OPS\"}" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["data"]["id"])')
          PROBE_TOKEN=$(curl -fsS -X POST http://127.0.0.1:8081/api/v1/auth/login \
            -H "Content-Type: application/json" \
            -d "{\"username\":\"${PROBE_USER}\",\"password\":\"probePass123\"}" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["data"]["token"])')
          test -n "$PROBE_TOKEN"
          pre_code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $PROBE_TOKEN" http://127.0.0.1:8081/api/v1/auth/me)
          test "$pre_code" = "200"
          logout_code=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H "Authorization: Bearer $PROBE_TOKEN" http://127.0.0.1:8081/api/v1/auth/logout)
          test "$logout_code" = "200"
          for r in 1 2 3 4; do
            revoked_code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $PROBE_TOKEN" http://127.0.0.1:8081/api/v1/auth/me)
            echo "Post-logout cross-replica /auth/me #$r -> HTTP $revoked_code"
            test "$revoked_code" = "401"
          done
          tok_ver=$($MYSQL_CMD "SELECT token_version FROM sys_user WHERE username='${PROBE_USER}';")
          echo "DB sys_user token_version for ${PROBE_USER}=$tok_ver"
          test "${tok_ver:-0}" -ge 1
          curl -fsS -X DELETE -H "Authorization: Bearer $TOKEN" "http://127.0.0.1:8081/api/v1/users/${PROBE_UID}" >/dev/null

          # 3. Single-leader monitor sampling without duplicate samples
          sleep 12
          leader_owner=$($MYSQL_CMD "SELECT owner_id FROM console_lease WHERE lease_key='scheduler:monitor';")
          echo "Initial monitor leader owner_id=$leader_owner"
          test -n "$leader_owner"
          sample_count=$($MYSQL_CMD "SELECT COUNT(*) FROM metric_point;")
          dup_count=$($MYSQL_CMD "SELECT COUNT(*) FROM metric_point a JOIN metric_point b ON a.instance_id=b.instance_id AND a.id < b.id AND TIMESTAMPDIFF(SECOND, a.collected_at, b.collected_at) < 3;")
          echo "Metric samples=$sample_count duplicate_within_3s=$dup_count"
          test "${sample_count:-0}" -ge 2
          test "${dup_count:-1}" -eq 0

          # 4. Stop current leader container -> verify Nginx HA failover + lease takeover by survivor
          if [[ "$leader_owner" == tk-console-1-* ]]; then
            leader_container="tk-console"
            survivor_prefix="tk-console-2-"
          else
            leader_container="tk-console-2"
            survivor_prefix="tk-console-1-"
          fi
          echo "Stopping leader container: $leader_container (expecting takeover by ${survivor_prefix}*)"
          docker stop "$leader_container"

          # Verify idempotent GET through Nginx keeps returning 200 across multiple requests
          for r in 1 2 3 4; do
            me_code=$(curl -s -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer $TOKEN" \
              http://127.0.0.1:8081/api/v1/auth/me)
            echo "Post-stop /auth/me #$r -> HTTP $me_code"
            test "$me_code" = "200"
          done

          # Wait up to 24s for 10s monitor lease expiry and automatic takeover by surviving replica
          taken_over="false"
          for i in $(seq 1 12); do
            new_owner=$($MYSQL_CMD "SELECT owner_id FROM console_lease WHERE lease_key='scheduler:monitor';")
            new_count=$($MYSQL_CMD "SELECT COUNT(*) FROM metric_point;")
            echo "Failover poll #$i: owner=$new_owner samples=$new_count"
            if [[ "$new_owner" == ${survivor_prefix}* ]] && [ "${new_count:-0}" -gt "$sample_count" ]; then
              taken_over="true"
              break
            fi
            sleep 2
          done
          test "$taken_over" = "true"
          echo "HA failover verified: leader switched from $leader_owner to $new_owner"
      - name: Dump HA compose logs on failure
        if: failure()
        working-directory: deploy/console
        run: docker compose -f docker-compose.yml -f docker-compose.ha.yml --profile s3 logs --tail=200
      - name: Tear down HA compose stack
        if: always()
        working-directory: deploy/console
        run: docker compose -f docker-compose.yml -f docker-compose.ha.yml --profile s3 down -v
