name: test

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  unit-and-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - run: mvn -B test
      # TODO(phase1+): 追加 tests/integration、tests/stress、tests/chaos 执行入口
