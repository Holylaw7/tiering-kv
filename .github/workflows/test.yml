name: test

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  unit-and-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      # 性能断言（@Tag("benchmark")）从功能门禁排除，由 release Benchmark 步骤
      # 显式执行；失败用例重跑一次，重跑仍失败则门禁照常失败，不掩盖真实缺陷。
      - run: mvn -B -Dsurefire.rerunFailingTestsCount=1 -Dsurefire.excludedGroups=benchmark test
      # TODO(phase1+): 追加 tests/integration、tests/stress、tests/chaos 执行入口
