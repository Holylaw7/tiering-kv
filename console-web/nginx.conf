server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 基础安全响应头与严格 CSP（M3-B3 / Wave 3A S3）
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 单页应用：所有前端路由回落到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 同源反代控制面，避免跨域配置
    location /api/ {
        proxy_pass http://console-server:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # 浏览器到 Nginx 已是同源；转发时清掉 Origin，
        # 否则 Spring CORS 会把它当作跨域请求直接 403
        proxy_set_header Origin "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location = /healthz {
        # 使用 default_type 避免在 location 内调用 add_header 覆盖 server 级安全响应头
        default_type text/plain;
        return 200 'ok';
    }
}

