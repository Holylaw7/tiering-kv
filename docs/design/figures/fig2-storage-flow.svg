<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="640" viewBox="0 0 1040 640"><rect x="0" y="0" width="1040" height="640" rx="8" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="1" /><text x="24" y="30" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="11.5" fill="#3B5BDB" font-weight="600" text-anchor="start">写入路径</text><rect x="24" y="42" width="190" height="66" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" /><text x="38" y="66" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="12.5" fill="#202124" font-weight="600" text-anchor="start">客户端写入</text><text x="38" y="88" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="10.5" fill="#626B78" font-weight="400" text-anchor="start">SET / HSET</text><defs><marker id="mkdblu6b" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#9AA4B2"/></marker></defs><line x1="216" y1="75" x2="232" y2="75" stroke="#9AA4B2" stroke-width="1.2" marker-end="url(#mkdblu6b)" /><rect x="234" y="42" width="190" height="66" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" /><text x="248" y="66" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="12.5" fill="#202124" font-weight="600" text-anchor="start">WAL</text><text x="248" y="88" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="10.5" fill="#626B78" font-weight="400" text-anchor="start">段 64MB · fsync 策略</text><defs><marker id="mk8vlir5" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#9AA4B2"/></marker></defs><line x1="426" y1="75" x2="442" y2="75" stroke="#9AA4B2" stroke-width="1.2" marker-end="url(#mk8vlir5)" /><rect x="444" y="42" width="190" height="66" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" /><text x="458" y="66" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="12.5" fill="#202124" font-weight="600" text-anchor="start">MemTable</text><text x="458" y="88" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="10.5" fill="#626B78" font-weight="400" text-anchor="start">分片跳表 · TTL · 热点</text><text x="24" y="132" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="10.5" fill="#B45309" font-weight="400" text-anchor="start">水位线 70% / 85% / 95% → 触发 Flush / 迁移 / 背压</text><text x="24" y="176" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="11.5" fill="#2F6B4F" font-weight="600" text-anchor="start">冷层路径</text><rect x="24" y="188" width="190" height="66" rx="8" fill="#EFF6F1" stroke="#BFD8C9" stroke-width="1" /><text x="38" y="212" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="12.5" fill="#202124" font-weight="600" text-anchor="start">SSTable 文件</text><text x="38" y="234" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="10.5" fill="#626B78" font-weight="400" text-anchor="start">BlockIndex · Bloom · CRC</text><defs><marker id="mkfwnjoe" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#7FA890"/></marker></defs><line x1="216" y1="221" x2="232" y2="221" stroke="#7FA890" stroke-width="1.2" marker-end="url(#mkfwnjoe)" /><rect x="234" y="188" width="190" height="66" rx="8" fill="#EFF6F1" stroke="#BFD8C9" stroke-width="1" /><text x="248" y="212" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="12.5" fill="#202124" font-weight="600" text-anchor="start">Compaction</text><text x="248" y="234" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="10.5" fill="#626B78" font-weight="400" text-anchor="start">阈值 8 张 · 输入→输出</text><defs><marker id="mkxj05fr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#7FA890"/></marker></defs><line x1="426" y1="221" x2="442" y2="221" stroke="#7FA890" stroke-width="1.2" marker-end="url(#mkxj05fr)" /><rect x="444" y="188" width="190" height="66" rx="8" fill="#EFF6F1" stroke="#BFD8C9" stroke-width="1" /><text x="458" y="212" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="12.5" fill="#202124" font-weight="600" text-anchor="start">冷热迁移</text><text x="458" y="234" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="10.5" fill="#626B78" font-weight="400" text-anchor="start">后台 worker · 失败计数</text><defs><marker id="mkng0iyr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#B45309"/></marker></defs><line x1="214" y1="110" x2="214" y2="184" stroke="#B45309" stroke-width="1.2" marker-end="url(#mkng0iyr)" stroke-dasharray="4 3"/><text x="24" y="300" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="11.5" fill="#3B5BDB" font-weight="600" text-anchor="start">读取路径</text><rect x="24" y="312" width="190" height="66" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" /><text x="38" y="336" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="12.5" fill="#202124" font-weight="600" text-anchor="start">GET 请求</text><text x="38" y="358" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="10.5" fill="#626B78" font-weight="400" text-anchor="start">先热层，后冷层</text><defs><marker id="mktx8p5n" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#9AA4B2"/></marker></defs><line x1="216" y1="345" x2="300" y2="345" stroke="#9AA4B2" stroke-width="1.2" marker-end="url(#mktx8p5n)" /><rect x="304" y="312" width="190" height="66" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" /><text x="318" y="336" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="12.5" fill="#202124" font-weight="600" text-anchor="start">BlockCache</text><text x="318" y="358" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="10.5" fill="#626B78" font-weight="400" text-anchor="start">命中率 / 淘汰（INFO 上报）</text><defs><marker id="mke0vymf" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#9AA4B2"/></marker></defs><line x1="496" y1="345" x2="580" y2="345" stroke="#9AA4B2" stroke-width="1.2" marker-end="url(#mke0vymf)" /><rect x="584" y="312" width="200" height="66" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" /><text x="598" y="336" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="12.5" fill="#202124" font-weight="600" text-anchor="start">mmap 读 SSTable</text><text x="598" y="358" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="10.5" fill="#626B78" font-weight="400" text-anchor="start">索引定位 → 块解码 → 校验</text><defs><marker id="mkde3do6" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#9AA4B2"/></marker></defs><line x1="786" y1="345" x2="866" y2="345" stroke="#9AA4B2" stroke-width="1.2" marker-end="url(#mkde3do6)" /><rect x="870" y="312" width="146" height="66" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" /><text x="884" y="336" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="12.5" fill="#202124" font-weight="600" text-anchor="start">回源</text><text x="884" y="358" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="10.5" fill="#626B78" font-weight="400" text-anchor="start">copy-up 到热层</text><rect x="24" y="410" width="992" height="120" rx="8" fill="#FBFCFE" stroke="#E5E7EB" stroke-width="1" /><text x="44" y="436" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="11.5" fill="#626B78" font-weight="600" text-anchor="start">一次性成本边界（实测口径）</text><text x="48" y="462" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="11" fill="#626B78" font-weight="400" text-anchor="start">· INFO 渲染：一次刷新 + 一次快照，O(表数) 复制，不做目录扫描</text><text x="48" y="484" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="11" fill="#626B78" font-weight="400" text-anchor="start">· INFO sstables：按需段落，不进入全量 INFO</text><text x="48" y="506" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="11" fill="#626B78" font-weight="400" text-anchor="start">· 冷层精确计数（DBSIZE 口径）：冷层变更后首次全量迭代</text><rect x="24" y="552" width="300" height="36" rx="8" fill="#EEF2FF" stroke="#C7D2F5" stroke-width="1" /><text x="174" y="575" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="11" fill="#3B5BDB" font-weight="400" text-anchor="middle">热数据：内存命中</text><rect x="340" y="552" width="340" height="36" rx="8" fill="#EFF6F1" stroke="#BFD8C9" stroke-width="1" /><text x="510" y="575" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="11" fill="#2F6B4F" font-weight="400" text-anchor="middle">冷数据：SSTable + 页缓存 + BlockCache</text><rect x="696" y="552" width="320" height="36" rx="8" fill="#FDF4E7" stroke="#EBD3AE" stroke-width="1" /><text x="856" y="575" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="11" fill="#B45309" font-weight="400" text-anchor="middle">内存上限由水位线约束，触发迁移/淘汰</text><text x="24" y="620" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="11" fill="#9299A3" font-weight="400" text-anchor="start">图 2　存储引擎数据流：写入（WAL→MemTable→Flush→Compaction）与读取（热层→BlockCache→SSTable）</text></svg>