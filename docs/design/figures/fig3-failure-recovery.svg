l7w)" /><rect x="284" y="236" width="208" height="62" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" /><text x="298" y="260" font-family="'Cascadia Mono','Consolas',monospace" font-size="10" fill="#B45309" font-weight="400" text-anchor="start">02</text><text x="318" y="260" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="12" fill="#202124" font-weight="600" text-anchor="start">重启读 WAL</text><defs><marker id="mk8ih8k1" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#C3CBD5"/></marker></defs><line x1="494" y1="267" x2="520" y2="267" stroke="#C3CBD5" stroke-width="1.2" marker-end="url(#mk8ih8k1)" /><rect x="524" y="236" width="208" height="62" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" /><text x="538" y="260" font-family="'Cascadia Mono','Consolas',monospace" font-size="10" fill="#B45309" font-weight="400" text-anchor="start">03</text><text x="558" y="260" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="12" fill="#202124" font-weight="600" text-anchor="start">重放到最后落盘点</text><defs><marker id="mkj0whut" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#C3CBD5"/></marker></defs><line x1="734" y1="267" x2="760" y2="267" stroke="#C3CBD5" stroke-width="1.2" marker-end="url(#mkj0whut)" /><rect x="764" y="236" width="208" height="62" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" /><text x="778" y="260" font-family="'Cascadia Mono','Consolas',monospace" font-size="10" fill="#B45309" font-weight="400" text-anchor="start">04</text><text x="798" y="260" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="12" fill="#202124" font-weight="600" text-anchor="start">DBSIZE/键值校验</text><text x="44" y="312" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="10.5" fill="#626B78" font-weight="400" text-anchor="start">后台每 500ms flush+fsync；实测崩溃恢复 100/100 键存活，进程级计数归零</text><rect x="24" y="340" width="992" height="130" rx="10" fill="#EFF6F1" stroke="#E5E7EB" stroke-width="1" /><text x="44" y="368" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="12.5" fill="#6FA88A" font-weight="600" text-anchor="start">C. 备份恢复</text><rect x="44" y="386" width="208" height="62" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" /><text x="58" y="410" font-family="'Cascadia Mono','Consolas',monospace" font-size="10" fill="#6FA88A" font-weight="400" text-anchor="start">01</text><text x="78" y="410" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="12" fill="#202124" font-weight="600" text-anchor="start">校验 SUCCESS</text><defs><marker id="mkoa5z0e" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#C3CBD5"/></marker></defs><line x1="254" y1="417" x2="280" y2="417" stroke="#C3CBD5" stroke-width="1.2" marker-end="url(#mkoa5z0e)" /><rect x="284" y="386" width="208" height="62" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" /><text x="298" y="410" font-family="'Cascadia Mono','Consolas',monospace" font-size="10" fill="#6FA88A" font-weight="400" text-anchor="start">02</text><text x="318" y="410" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="12" fill="#202124" font-weight="600" text-anchor="start">逐行回放</text><defs><marker id="mkip6j58" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#C3CBD5"/></marker></defs><line x1="494" y1="417" x2="520" y2="417" stroke="#C3CBD5" stroke-width="1.2" marker-end="url(#mkip6j58)" /><rect x="524" y="386" width="208" height="62" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" /><text x="538" y="410" font-family="'Cascadia Mono','Consolas',monospace" font-size="10" fill="#6FA88A" font-weight="400" text-anchor="start">03</text><text x="558" y="410" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="12" fill="#202124" font-weight="600" text-anchor="start">DEL + 写入（合并）</text><defs><ma