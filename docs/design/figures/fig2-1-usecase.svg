<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="720" viewBox="0 0 1120 720">
  <rect width="1120" height="720" fill="#FFFFFF"/>
  <defs>
    <marker id="gen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,1 L10,6 L0,11 z" fill="#FFFFFF" stroke="#475569" stroke-width="1.5"/>
    </marker>
    <marker id="dep" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#94A3B8"/>
    </marker>
  </defs>

  <!-- System Boundary -->
  <rect x="230" y="24" width="650" height="672" rx="12" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="555" y="54" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">键值存储管理系统（Spring Boot + Vue 控制平面）</text>

  <!-- Actors on Left -->
  <!-- VIEWER -->
  <g transform="translate(88, 130)">
    <circle cx="0" cy="-24" r="14" fill="#FFFFFF" stroke="#334155" stroke-width="1.8"/>
    <line x1="0" y1="-10" x2="0" y2="24" stroke="#334155" stroke-width="1.8"/>
    <line x1="-20" y1="2" x2="20" y2="2" stroke="#334155" stroke-width="1.8"/>
    <line x1="0" y1="24" x2="-15" y2="48" stroke="#334155" stroke-width="1.8"/>
    <line x1="0" y1="24" x2="15" y2="48" stroke="#334155" stroke-width="1.8"/>
    <text x="0" y="68" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="13" font-weight="700" fill="#0F172A" text-anchor="middle">VIEWER</text>
    <text x="0" y="85" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="11" fill="#64748B" text-anchor="middle">只读成员</text>
  </g>

  <!-- OPS -->
  <g transform="translate(88, 355)">
    <circle cx="0" cy="-24" r="14" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="1.8"/>
    <line x1="0" y1="-10" x2="0" y2="24" stroke="#1D4ED8" stroke-width="1.8"/>
    <line x1="-20" y1="2" x2="20" y2="2" stroke="#1D4ED8" stroke-width="1.8"/>
    <line x1="0" y1="24" x2="-15" y2="48" stroke="#1D4ED8" stroke-width="1.8"/>
    <line x1="0" y1="24" x2="15" y2="48" stroke="#1D4ED8" stroke-width="1.8"/>
    <text x="0" y="68" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="13" font-weight="700" fill="#1D4ED8" text-anchor="middle">OPS</text>
    <text x="0" y="85" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="11" fill="#64748B" text-anchor="middle">运维人员</text>
  </g>

  <!-- ADMIN -->
  <g transform="translate(88, 565)">
    <circle cx="0" cy="-24" r="14" fill="#FFFFFF" stroke="#2F6B4F" stroke-width="1.8"/>
    <line x1="0" y1="-10" x2="0" y2="24" stroke="#2F6B4F" stroke-width="1.8"/>
    <line x1="-20" y1="2" x2="20" y2="2" stroke="#2F6B4F" stroke-width="1.8"/>
    <line x1="0" y1="24" x2="-15" y2="48" stroke="#2F6B4F" stroke-width="1.8"/>
    <line x1="0" y1="24" x2="15" y2="48" stroke="#2F6B4F" stroke-width="1.8"/>
    <text x="0" y="68" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="13" font-weight="700" fill="#2F6B4F" text-anchor="middle">ADMIN</text>
    <text x="0" y="85" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="11" fill="#64748B" text-anchor="middle">系统管理员</text>
  </g>

  <!-- Generalization arrows -->
  <line x1="88" y1="312" x2="88" y2="225" stroke="#475569" stroke-width="1.5" marker-end="url(#gen)"/>
  <text x="52" y="274" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="10.5" fill="#64748B" text-anchor="middle">继承权限</text>
  <line x1="88" y1="522" x2="88" y2="448" stroke="#475569" stroke-width="1.5" marker-end="url(#gen)"/>
  <text x="52" y="490" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="10.5" fill="#64748B" text-anchor="middle">继承权限</text>

  <!-- Group Boxes inside Boundary -->
  <rect x="255" y="74" width="600" height="196" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="272" y="96" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="11.5" font-weight="600" fill="#475569">只读观测与基础账户用例（VIEWER 及以上）</text>

  <rect x="255" y="286" width="600" height="226" rx="8" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="1.1" stroke-dasharray="4 3"/>
  <text x="272" y="308" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="11.5" font-weight="600" fill="#1D4ED8">运维写操作用例（OPS / ADMIN，@PreAuthorize）</text>

  <rect x="255" y="528" width="600" height="150" rx="8" fill="#FFFFFF" stroke="#A7F3D0" stroke-width="1.1" stroke-dasharray="4 3"/>
  <text x="272" y="550" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="11.5" font-weight="600" fill="#2F6B4F">系统安全治理与高危恢复用例（仅 ADMIN）</text>

  <!-- Use Cases Group 1 -->
  <ellipse cx="400" cy="134" rx="122" ry="22" fill="#F8FAFC" stroke="#64748B" stroke-width="1.2"/>
  <text x="400" y="139" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="12" fill="#0F172A" text-anchor="middle">运行总览与实时趋势监控</text>

  <ellipse cx="695" cy="134" rx="130" ry="22" fill="#F8FAFC" stroke="#64748B" stroke-width="1.2"/>
  <text x="695" y="139" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="12" fill="#0F172A" text-anchor="middle">分层指标与 SSTable 清单查看</text>

  <ellipse cx="400" cy="186" rx="122" ry="22" fill="#F8FAFC" stroke="#64748B" stroke-width="1.2"/>
  <text x="400" y="191" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="12" fill="#0F172A" text-anchor="middle">键空间 SCAN 浏览与详情查看</text>

  <ellipse cx="695" cy="186" rx="130" ry="22" fill="#F8FAFC" stroke="#64748B" stroke-width="1.2"/>
  <text x="695" y="191" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="12" fill="#0F172A" text-anchor="middle">慢查询日志与终端历史查阅</text>

  <ellipse cx="400" cy="238" rx="122" ry="22" fill="#F8FAFC" stroke="#64748B" stroke-width="1.2"/>
  <text x="400" y="243" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="12" fill="#0F172A" text-anchor="middle">备份文件下载与快照状态查看</text>

  <ellipse cx="695" cy="238" rx="130" ry="22" fill="#F8FAFC" stroke="#64748B" stroke-width="1.2"/>
  <text x="695" y="243" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="12" fill="#0F172A" text-anchor="middle">实例探测、告警查看与口令修改</text>

  <!-- Use Cases Group 2 -->
  <ellipse cx="400" cy="348" rx="122" ry="22" fill="#EEF2FF" stroke="#3B5BDB" stroke-width="1.2"/>
  <text x="400" y="353" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="12" fill="#1E3A8A" text-anchor="middle">实例新增注册与编辑配置</text>

  <ellipse cx="695" cy="348" rx="130" ry="22" fill="#EEF2FF" stroke="#3B5BDB" stroke-width="1.2"/>
  <text x="695" y="353" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="12" fill="#1E3A8A" text-anchor="middle">键值增删改与 TTL 有效期调整</text>

  <ellipse cx="400" cy="408" rx="122" ry="22" fill="#EEF2FF" stroke="#3B5BDB" stroke-width="1.2"/>
  <text x="400" y="413" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="12" fill="#1E3A8A" text-anchor="middle">在线终端命令执行与高危拦截</text>

  <ellipse cx="695" cy="408" rx="130" ry="22" fill="#EEF2FF" stroke="#3B5BDB" stroke-width="1.2"/>
  <text x="695" y="413" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="12" fill="#1E3A8A" text-anchor="middle">告警规则维护、消警与慢日志重置</text>

  <ellipse cx="548" cy="472" rx="195" ry="24" fill="#EEF2FF" stroke="#3B5BDB" stroke-width="1.2"/>
  <text x="548" y="477" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="12" fill="#1E3A8A" text-anchor="middle">触发异步逻辑备份、删除过期备份与 BGSAVE 物理快照</text>

  <!-- Use Cases Group 3 -->
  <ellipse cx="400" cy="592" rx="122" ry="22" fill="#EFF6F1" stroke="#2F6B4F" stroke-width="1.3"/>
  <text x="400" y="597" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="12" fill="#14532D" text-anchor="middle">全量数据合并式恢复与手动清理</text>

  <ellipse cx="695" cy="592" rx="130" ry="22" fill="#EFF6F1" stroke="#2F6B4F" stroke-width="1.3"/>
  <text x="695" y="597" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="12" fill="#14532D" text-anchor="middle">审计日志检索与 RFC 4180 CSV 导出</text>

  <ellipse cx="548" cy="648" rx="185" ry="22" fill="#EFF6F1" stroke="#2F6B4F" stroke-width="1.3"/>
  <text x="548" y="653" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="12" fill="#14532D" text-anchor="middle">用户账号创建、角色授权、重置口令与实例删除</text>

  <!-- Association lines -->
  <line x1="115" y1="138" x2="278" y2="134" stroke="#64748B" stroke-width="1.2"/>
  <line x1="115" y1="145" x2="278" y2="186" stroke="#64748B" stroke-width="1.2"/>
  <line x1="115" y1="152" x2="278" y2="238" stroke="#64748B" stroke-width="1.2"/>

  <line x1="115" y1="360" x2="278" y2="348" stroke="#3B5BDB" stroke-width="1.2"/>
  <line x1="115" y1="370" x2="278" y2="408" stroke="#3B5BDB" stroke-width="1.2"/>
  <line x1="115" y1="382" x2="353" y2="472" stroke="#3B5BDB" stroke-width="1.2"/>

  <line x1="115" y1="575" x2="278" y2="592" stroke="#2F6B4F" stroke-width="1.3"/>
  <line x1="115" y1="590" x2="363" y2="648" stroke="#2F6B4F" stroke-width="1.3"/>

  <!-- External System Actors on Right -->
  <rect x="912" y="135" width="184" height="92" rx="8" fill="#FFFFFF" stroke="#6FA88A" stroke-width="1.4"/>
  <text x="1004" y="163" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="12" font-weight="700" fill="#2F6B4F" text-anchor="middle">&lt;&lt;外部系统&gt;&gt;</text>
  <text x="1004" y="185" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="13" font-weight="600" fill="#0F172A" text-anchor="middle">Tiering-KV 数据面</text>
  <text x="1004" y="206" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="11" fill="#64748B" text-anchor="middle">RESP2 TCP :6379</text>

  <rect x="912" y="365" width="184" height="82" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.4"/>
  <text x="1004" y="392" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">&lt;&lt;基础设施&gt;&gt;</text>
  <text x="1004" y="414" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="13" font-weight="600" fill="#0F172A" text-anchor="middle">MySQL 8.0 元数据库</text>
  <text x="1004" y="434" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="11" fill="#64748B" text-anchor="middle">Flyway 10 张持久化表</text>

  <rect x="912" y="492" width="184" height="82" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.4"/>
  <text x="1004" y="519" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">&lt;&lt;存储后端&gt;&gt;</text>
  <text x="1004" y="541" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="13" font-weight="600" fill="#0F172A" text-anchor="middle">本地卷 / S3 对象存储</text>
  <text x="1004" y="561" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="11" fill="#64748B" text-anchor="middle">Gzip JSONL 备份归档</text>

  <line x1="825" y1="160" x2="910" y2="175" stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#dep)"/>
  <line x1="825" y1="352" x2="910" y2="195" stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#dep)"/>
  <line x1="825" y1="408" x2="910" y2="408" stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#dep)"/>
  <line x1="743" y1="472" x2="910" y2="528" stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#dep)"/>
  <line x1="825" y1="592" x2="910" y2="424" stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#dep)"/>
</svg>
