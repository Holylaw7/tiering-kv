<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="690" viewBox="0 0 1100 690">
  <rect width="1100" height="690" fill="#FFFFFF"/>
  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="#475569"/>
    </marker>
    <marker id="arBlue" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="#3B5BDB"/>
    </marker>
    <marker id="arGreen" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="#2F6B4F"/>
    </marker>
  </defs>

  <!-- Layer 1: Presentation Layer (Vue 3) -->
  <rect x="28" y="22" width="1044" height="128" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.3"/>
  <text x="48" y="48" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="13" font-weight="700" fill="#1E293B">表现层 · Web 单页控制台（Vue 3.5 + TypeScript + Element Plus + ECharts 5，Nginx 同源反代 :8081）</text>

  <rect x="48" y="64" width="232" height="68" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="164" y="89" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="13" font-weight="600" fill="#0F172A" text-anchor="middle">路由守卫与状态管理</text>
  <text x="164" y="112" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="11" fill="#64748B" text-anchor="middle">Pinia Auth / Instance Store · 路由鉴权</text>

  <rect x="302" y="64" width="242" height="68" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="423" y="89" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="13" font-weight="600" fill="#0F172A" text-anchor="middle">监控与分层可视化视图</text>
  <text x="423" y="112" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="11" fill="#64748B" text-anchor="middle">运行总览 · 4 组趋势图 · 70/85/95 水位尺</text>

  <rect x="566" y="64" width="242" height="68" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="687" y="89" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="13" font-weight="600" fill="#0F172A" text-anchor="middle">数据运维与诊断工作区</text>
  <text x="687" y="112" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="11" fill="#64748B" text-anchor="middle">键空间维护 · 在线终端 · 慢查询 · 实例</text>

  <rect x="830" y="64" width="222" height="68" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="941" y="89" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="13" font-weight="600" fill="#0F172A" text-anchor="middle">可靠性与治理中心</text>
  <text x="941" y="112" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="11" fill="#64748B" text-anchor="middle">告警中心 · 备份/Checkpoint · 审计/用户</text>

  <!-- Connector 1 -> 2 -->
  <line x1="550" y1="150" x2="550" y2="188" stroke="#3B5BDB" stroke-width="1.6" marker-end="url(#arBlue)"/>
  <rect x="355" y="156" width="390" height="22" rx="6" fill="#EEF2FF" stroke="#C7D2F5" stroke-width="1"/>
  <text x="550" y="171" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="11" font-weight="600" fill="#3B5BDB" text-anchor="middle">HTTP / JSON REST API（/api/v1/*）· Bearer JWT · OpenAPI 3 契约</text>

  <!-- Layer 2: Control Plane (Spring Boot 3.5) -->
  <rect x="28" y="192" width="1044" height="236" rx="10" fill="#FFFFFF" stroke="#3B5BDB" stroke-width="1.5"/>
  <text x="48" y="218" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="13.5" font-weight="700" fill="#1D4ED8">控制平面 · 应用服务层（Java 21 + Spring Boot 3.5.16，11 个 REST Controller / 核心 Service 群）</text>

  <!-- Row 1 in Control Plane -->
  <rect x="48" y="232" width="320" height="74" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
  <text x="64" y="254" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="12.5" font-weight="700" fill="#0F172A">安全认证与 RBAC 切面</text>
  <text x="64" y="275" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="11" fill="#475569">JwtAuthenticationFilter · HS256 无状态验签</text>
  <text x="64" y="294" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="11" fill="#475569">LoginAttemptGuard 限流 · AES-256-GCM 实例口令</text>

  <rect x="390" y="232" width="320" height="74" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
  <text x="406" y="254" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="12.5" font-weight="700" fill="#0F172A">监控采集与告警引擎</text>
  <text x="406" y="275" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="11" fill="#475569">MonitorService 5s 固定延迟采集与实时快照</text>
  <text x="406" y="294" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="11" fill="#475569">InfoParser 分段解析 · AlertService 持续时长求值</text>

  <rect x="732" y="232" width="320" height="74" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
  <text x="748" y="254" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="12.5" font-weight="700" fill="#0F172A">数据维护与终端网关</text>
  <text x="748" y="275" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="11" fill="#475569">KeyspaceService（SCAN 游标 / 五类结构维护）</text>
  <text x="748" y="294" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="11" fill="#475569">TerminalService（黑名单拦截 + 敏感凭证脱敏）</text>

  <!-- Row 2 in Control Plane -->
  <rect x="48" y="320" width="380" height="90" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
  <text x="64" y="343" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="12.5" font-weight="700" fill="#0F172A">备份恢复与配额治理子系统</text>
  <text x="64" y="364" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="11" fill="#475569">BackupService：实例互斥锁 + Gzip 流式导出 + 合并式恢复</text>
  <text x="64" y="383" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="11" fill="#475569">BackupCapacityService（507 配额预留）· Retention 清理</text>
  <text x="64" y="401" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="11" fill="#475569">BGSAVE / LASTSAVE 物理 Checkpoint 协同状态机</text>

  <rect x="448" y="320" width="280" height="90" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
  <text x="464" y="343" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="12.5" font-weight="700" fill="#0F172A">全链路审计与定时清理</text>
  <text x="464" y="364" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="11" fill="#475569">AuditService（REQUIRES_NEW 独立事务）</text>
  <text x="464" y="383" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="11" fill="#475569">多维 Specification 检索 + RFC 4180 CSV</text>
  <text x="464" y="401" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="11" fill="#475569">RetentionService（指标 / 30 天日志清理）</text>

  <rect x="748" y="320" width="304" height="90" rx="8" fill="#EEF2FF" stroke="#818CF8" stroke-width="1.2"/>
  <text x="764" y="343" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="12.5" font-weight="700" fill="#1E3A8A">RespGateway &amp; RespClientPool</text>
  <text x="764" y="364" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="11" fill="#334155">手写原生 RESP2 Socket 编解码</text>
  <text x="764" y="383" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="11" fill="#334155">Semaphore 有界许可（防高并发击穿实例）</text>
  <text x="764" y="401" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="11" fill="#334155">支持无口令 / AUTH 认证与空闲超时剔除</text>

  <!-- Connector 2 -> 3 -->
  <line x1="210" y1="428" x2="210" y2="480" stroke="#475569" stroke-width="1.4" marker-end="url(#ar)"/>
  <text x="220" y="458" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="11" fill="#475569">JDBC / JPA + Flyway V1~V6</text>

  <line x1="485" y1="428" x2="485" y2="480" stroke="#475569" stroke-width="1.4" marker-end="url(#ar)"/>
  <text x="495" y="458" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="11" fill="#475569">BackupStorageBackend SPI</text>

  <line x1="900" y1="428" x2="900" y2="480" stroke="#2F6B4F" stroke-width="1.6" marker-end="url(#arGreen)"/>
  <text x="910" y="458" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="11" font-weight="600" fill="#2F6B4F">TCP RESP2（非侵入隔离）</text>

  <!-- Layer 3: Infrastructure & Data Plane -->
  <rect x="28" y="484" width="320" height="178" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.3"/>
  <text x="48" y="512" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="13" font-weight="700" fill="#0F172A">控制面元数据库 · MySQL 8.0</text>
  <text x="48" y="538" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="11.5" fill="#475569">· 账户与权限：sys_user</text>
  <text x="48" y="560" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="11.5" fill="#475569">· 实例与观测：db_instance / metric_point</text>
  <text x="48" y="582" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="11.5" fill="#475569">· 告警状态机：alert_rule / alert_event</text>
  <text x="48" y="604" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="11.5" fill="#475569">· 备份与配额：backup_record / capacity /</text>
  <text x="60" y="622" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="11.5" fill="#475569">  backup_reservation</text>
  <text x="48" y="644" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="11.5" fill="#475569">· 轨迹审计：op_log / terminal_history</text>

  <rect x="372" y="484" width="318" height="178" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.3"/>
  <text x="392" y="512" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="13" font-weight="700" fill="#0F172A">备份持久化双存储后端</text>
  <rect x="392" y="528" width="278" height="54" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="406" y="550" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="12" font-weight="600" fill="#0F172A">LocalBackupStorageBackend</text>
  <text x="406" y="570" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="11" fill="#64748B">规范化路径防目录穿越 · 暂存原子替换</text>

  <rect x="392" y="592" width="278" height="56" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="406" y="614" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="12" font-weight="600" fill="#0F172A">S3BackupStorageBackend (AWS SDK v2)</text>
  <text x="406" y="634" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="11" fill="#64748B">Path-Style · &gt;=16 MB 8 MB 分片 · S3/MinIO/RustFS</text>

  <rect x="714" y="484" width="358" height="178" rx="10" fill="#EFF6F1" stroke="#6FA88A" stroke-width="1.5"/>
  <text x="734" y="512" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="13" font-weight="700" fill="#2F6B4F">被纳管数据平面 · 独立键值存储内核</text>
  <text x="734" y="538" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="11.5" fill="#334155">· Netty RESP 服务与 16 分片单连接保序执行</text>
  <text x="734" y="560" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="11.5" fill="#334155">· 分层路径：WAL → MemTable（70/85/95 水位）</text>
  <text x="746" y="578" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="11.5" fill="#334155">→ Flush → SSTable（BloomFilter + mmap）</text>
  <text x="734" y="600" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="11.5" fill="#334155">· 运维原语出口：INFO / INFO sstables /</text>
  <text x="746" y="618" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="11.5" fill="#334155">  SCAN / SLOWLOG / BGSAVE / LASTSAVE</text>
  <text x="734" y="644" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="11" font-weight="600" fill="#2F6B4F">约束：控制面不直读内核目录，故障互不耦合</text>
</svg>
