services:
  node1:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: tiering-c-node1
    command:
      - --nodeId
      - node1
      - --port
      - "7000"
      - --peers
      - node1@node1:7000,node2@node2:7000,node3@node3:7000
      - --data
      - /data
    volumes:
      - data-node1:/data
    cap_add:
      - NET_ADMIN
    networks:
      - tiering-cluster-net

  node2:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: tiering-c-node2
    command:
      - --nodeId
      - node2
      - --port
      - "7000"
      - --peers
      - node1@node1:7000,node2@node2:7000,node3@node3:7000
      - --data
      - /data
    volumes:
      - data-node2:/data
    cap_add:
      - NET_ADMIN
    networks:
      - tiering-cluster-net

  node3:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: tiering-c-node3
    command:
      - --nodeId
      - node3
      - --port
      - "7000"
      - --peers
      - node1@node1:7000,node2@node2:7000,node3@node3:7000
      - --data
      - /data
    volumes:
      - data-node3:/data
    cap_add:
      - NET_ADMIN
    networks:
      - tiering-cluster-net

volumes:
  data-node1:
  data-node2:
  data-node3:

networks:
  tiering-cluster-net:
    driver: bridge
