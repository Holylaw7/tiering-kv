apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: tieringkvclusters.tieringkv.io
spec:
  group: tieringkv.io
  scope: Namespaced
  names:
    plural: tieringkvclusters
    singular: tieringkvcluster
    kind: TieringKVCluster
    shortNames:
      - tkc
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [metadataReplicas, storageReplicas, regionIds, image]
              properties:
                metadataReplicas:
                  type: integer
                  minimum: 1
                storageReplicas:
                  type: integer
                  minimum: 1
                regionIds:
                  type: array
                  items:
                    type: string
                image:
                  type: string
                backupScheduleCron:
                  type: string
                backupRetentionHours:
                  type: integer
            status:
              type: object
              properties:
                readyMetadata:
                  type: integer
                readyStorage:
                  type: integer
                readyGateway:
                  type: integer
                observedGeneration:
                  type: integer
                lastAction:
                  type: string
