apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: tieringkvclusters.tieringkv.io
spec:
  group: tieringkv.io
  scope: Namespaced
  names:
    plural: tieringkvclusters
    singular: tieringkvcluster
    kind: TieringKVCluster
    shortNames:
      - tkc
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Meta
          type: integer
          jsonPath: .status.readyMetadata
        - name: Storage
          type: integer
          jsonPath: .status.readyStorage
        - name: Gateway
          type: integer
          jsonPath: .status.readyGateway
        - name: Image
          type: string
          jsonPath: .spec.image
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [metadataReplicas, storageReplicas, regionIds, image]
              properties:
                metadataReplicas:
                  type: integer
                  minimum: 1
                storageReplicas:
                  type: integer
                  minimum: 1
                gatewayReplicas:
                  type: integer
                  minimum: 1
                regionIds:
                  type: array
                  items:
                    type: string
                image:
                  type: string
                storageClassName:
                  type: string
                metadataStorageSize:
                  type: string
                storageDataSize:
                  type: string
                backupScheduleCron:
                  type: string
                backupRetentionHours:
                  type: integer
            status:
              type: object
              properties:
                phase:
                  type: string
                readyMetadata:
                  type: integer
                readyStorage:
                  type: integer
                readyGateway:
                  type: integer
                observedGeneration:
                  type: integer
                lastAction:
                  type: string
                lastBackupJob:
                  type: string
                lastBackupStatus:
                  type: string
                lastBackupTime:
                  type: string
                message:
                  type: string
