apiVersion: apps/v1
kind: Deployment
metadata:
  name: tiering-kv-operator
  namespace: tiering-kv
  labels:
    app: tiering-kv-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tiering-kv-operator
  template:
    metadata:
      labels:
        app: tiering-kv-operator
    spec:
      serviceAccountName: tiering-kv-operator
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: operator
          image: ghcr.io/holylaw7/tiering-kv-operator:v6.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: health
              containerPort: 8088
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: OPERATOR_HEALTH_PORT
              value: "8088"
            - name: OPERATOR_LEADER_ELECTION
              value: "true"
            - name: OPERATOR_LEASE_NAME
              value: tiering-kv-operator-leader
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
