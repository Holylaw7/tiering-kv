# Tiering-KV 全栈一键部署：内核 + 控制面 + 前端 + MySQL
# 用法：cd deploy/console && docker compose up -d --build
# 访问：http://localhost:8081 （控制台） / 127.0.0.1:6379 （RESP）
name: tiering-kv-console

services:
  mysql:
    image: mysql:8.0
    container_name: tk-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-tk_root_pwd}
      MYSQL_DATABASE: tiering_console
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-tk_root_pwd}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - tk-net

  tiering-kv:
    build:
      context: ../..
      dockerfile: deploy/Dockerfile
    container_name: tk-core
    command: ["--config", "config/application.yaml"]
    ports:
      - "6379:6379"
    volumes:
      - core-data:/app/data
    networks:
      - tk-net

  console-server:
    build:
      context: ../../console-server
    container_name: tk-console
    environment:
      CONSOLE_DB_URL: jdbc:mysql://mysql:3306/tiering_console?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
      CONSOLE_DB_USER: root
      CONSOLE_DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-tk_root_pwd}
      CONSOLE_JWT_SECRET: ${CONSOLE_JWT_SECRET:-change-me-in-production-0123456789abcdef}
      CONSOLE_BACKUP_DIR: /app/backups
    depends_on:
      mysql:
        condition: service_healthy
      tiering-kv:
        condition: service_started
    volumes:
      - console-backups:/app/backups
    networks:
      - tk-net

  console-web:
    build:
      context: ../../console-web
    container_name: tk-web
    ports:
      - "8081:80"
    depends_on:
      - console-server
    networks:
      - tk-net

volumes:
  mysql-data:
  core-data:
  console-backups:

networks:
  tk-net:
    driver: bridge
