services:
  metadata:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: txn-meta
    # netem 混沌注入（ADR-0343）：容器内 tc 需要 NET_ADMIN 能力。
    cap_add:
      - NET_ADMIN
    # 显式运行 TxnRuntimeMain（--role 分发、--node-id 连字符参数）。
    # ClusterMain（--nodeId/--port/--peers）仅用于 docker-compose.cluster.yml，
    # 勿将两套入口参数混用。
    entrypoint: ["java", "-Xmx1g", "-cp", "/app/tiering-kv.jar", "io.tieringkv.runtime.TxnRuntimeMain"]
    command:
      - --role
      - metadata
      - --node-id
      - metadata-1
      - --rpc-port
      - "7300"
      - --data-dir
      - /data
    volumes:
      - txn-meta:/data
    networks:
      - txn-cluster

  participant-a:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: txn-participant-a
    cap_add:
      - NET_ADMIN
    entrypoint: ["java", "-Xmx1g", "-cp", "/app/tiering-kv.jar", "io.tieringkv.runtime.TxnRuntimeMain"]
    command:
      - --role
      - participant
      - --node-id
      - participant-a
      - --region-id
      - r1
      - --rpc-port
      - "7100"
      - --data-dir
      - /data
    volumes:
      - txn-participant-a:/data
    networks:
      - txn-cluster

  participant-b:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: txn-participant-b
    cap_add:
      - NET_ADMIN
    entrypoint: ["java", "-Xmx1g", "-cp", "/app/tiering-kv.jar", "io.tieringkv.runtime.TxnRuntimeMain"]
    command:
      - --role
      - participant
      - --node-id
      - participant-b
      - --region-id
      - r2
      - --rpc-port
      - "7100"
      - --data-dir
      - /data
    volumes:
      - txn-participant-b:/data
    networks:
      - txn-cluster

  coordinator:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: txn-coordinator
    cap_add:
      - NET_ADMIN
    entrypoint: ["java", "-Xmx1g", "-cp", "/app/tiering-kv.jar", "io.tieringkv.runtime.TxnRuntimeMain"]
    command:
      - --role
      - coordinator
      - --node-id
      - coordinator-1
      - --rpc-port
      - "7200"
      - --metadata-node
      - metadata
      - --metadata-port
      - "7300"
      - --regions
      - r1@participant-a:7100,r2@participant-b:7100
    networks:
      - txn-cluster

  gateway:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: txn-gateway
    entrypoint: ["java", "-Xmx1g", "-cp", "/app/tiering-kv.jar", "io.tieringkv.runtime.TxnRuntimeMain"]
    command:
      - --role
      - gateway
      - --node-id
      - gateway-1
      - --rpc-port
      - "7201"
      - --gateway-port
      - "6379"
      - --metadata-node
      - metadata
      - --metadata-port
      - "7300"
      - --regions
      - r1@participant-a:7100,r2@participant-b:7100
    ports:
      - "6379:6379"
    networks:
      - txn-cluster

volumes:
  txn-meta:
  txn-participant-a:
  txn-participant-b:

networks:
  txn-cluster:
    driver: bridge
