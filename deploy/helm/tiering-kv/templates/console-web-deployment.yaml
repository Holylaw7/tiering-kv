{{- if .Values.consoleWeb.enabled }}
{{- $full := include "tiering-kv.fullname" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $full }}-console-web
  labels:
    {{- include "tiering-kv.labels" . | nindent 4 }}
    app.kubernetes.io/component: console-web
spec:
  replicas: {{ .Values.consoleWeb.replicaCount }}
  selector:
    matchLabels:
      {{- include "tiering-kv.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: console-web
  template:
    metadata:
      labels:
        {{- include "tiering-kv.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: console-web
    spec:
      {{- with .Values.consoleWeb.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: console-web
          image: "{{ .Values.consoleWeb.image.repository }}:{{ .Values.consoleWeb.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          securityContext:
            {{- toYaml .Values.consoleWeb.securityContext | nindent 12 }}
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: nginx-cache
              mountPath: /var/cache/nginx
          resources:
            {{- toYaml .Values.consoleWeb.resources | nindent 12 }}
      volumes:
        - name: nginx-config
          configMap:
            name: {{ $full }}-console-web-nginx
        - name: tmp
          emptyDir: {}
        - name: nginx-cache
          emptyDir: {}
{{- end }}
