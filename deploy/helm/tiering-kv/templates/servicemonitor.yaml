{{- if .Values.observability.serviceMonitor.enabled }}
{{- $full := include "tiering-kv.fullname" . }}
{{- if and .Values.tieringKv.enabled (ne .Values.tieringKv.mode "cluster") }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ $full }}-core
  labels:
    {{- include "tiering-kv.labels" . | nindent 4 }}
    app.kubernetes.io/component: core
    {{- with .Values.observability.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "tiering-kv.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: core
  endpoints:
    - port: management
      path: /metrics
      interval: {{ .Values.observability.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.observability.serviceMonitor.scrapeTimeout }}
---
{{- end }}
{{- if .Values.consoleServer.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ $full }}-console-server
  labels:
    {{- include "tiering-kv.labels" . | nindent 4 }}
    app.kubernetes.io/component: console-server
    {{- with .Values.observability.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "tiering-kv.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: console-server
  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: {{ .Values.observability.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.observability.serviceMonitor.scrapeTimeout }}
      {{- with .Values.observability.serviceMonitor.consoleBearerTokenSecret }}
      bearerTokenSecret:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
{{- end }}
