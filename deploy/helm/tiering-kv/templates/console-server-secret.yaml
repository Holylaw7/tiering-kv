{{- if and .Values.consoleServer.enabled (not .Values.consoleServer.security.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tiering-kv.consoleSecretName" . }}
  labels:
    {{- include "tiering-kv.labels" . | nindent 4 }}
    app.kubernetes.io/component: console-server
type: Opaque
stringData:
  db-password: {{ .Values.consoleServer.database.password | quote }}
  jwt-secret: {{ .Values.consoleServer.security.jwtSecret | quote }}
  admin-password: {{ .Values.consoleServer.security.adminPassword | quote }}
  encryption-key: {{ .Values.consoleServer.security.encryptionKey | quote }}
  s3-access-key: {{ .Values.consoleServer.backup.s3.accessKey | quote }}
  s3-secret-key: {{ .Values.consoleServer.backup.s3.secretKey | quote }}
{{- end }}
