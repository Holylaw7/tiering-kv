apiVersion: v1
kind: Service
metadata:
  name: tiering-kv-meta
  labels:
    app: tiering-kv
    tier: metadata
spec:
  clusterIP: None
  selector:
    app: tiering-kv
    tier: metadata
  ports:
    - name: raft-rpc
      port: 7300
      targetPort: 7300
---
apiVersion: v1
kind: Service
metadata:
  name: tiering-kv-storage
  labels:
    app: tiering-kv
    tier: storage
spec:
  clusterIP: None
  selector:
    app: tiering-kv
    tier: storage
  ports:
    - name: raft-rpc
      port: 7100
      targetPort: 7100
---
apiVersion: v1
kind: Service
metadata:
  name: tiering-kv-gateway
  labels:
    app: tiering-kv
    tier: gateway
spec:
  type: ClusterIP
  selector:
    app: tiering-kv
    tier: gateway
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
